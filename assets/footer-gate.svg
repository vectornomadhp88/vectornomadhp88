<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Connection terminated footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0b3d"/><stop offset="1" stop-color="#04020c"/></linearGradient><filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="900" height="200" fill="url(#bg)"/>
<text x="450" y="98" text-anchor="middle" font-family="'Courier New',monospace" font-size="30" font-weight="bold" letter-spacing="8" fill="#fff" filter="url(#g)">[ CONNECTION TERMINATED ]</text>
<text x="450" y="132" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" letter-spacing="5" fill="#00C8FF">See you in the next dungeon<animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></text>
<rect x="0" y="0" width="450" height="200" fill="#05030f" fill-opacity=".92"><animate attributeName="x" values="-450;-450;0;0;-450" keyTimes="0;.4;.55;.8;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="450" y="0" width="450" height="200" fill="#05030f" fill-opacity=".92"><animate attributeName="x" values="900;900;450;450;900" keyTimes="0;.4;.55;.8;1" dur="8s" repeatCount="indefinite"/></rect>
</svg>