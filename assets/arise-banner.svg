<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="ARISE - Shadow Monarch banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030f"/><stop offset="1" stop-color="#1a0b3d"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7B2FFF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7B2FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3eaff"/><stop offset="1" stop-color="#7B2FFF"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B2FFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B0F8C" stop-opacity=".55"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Original shadow-soldier silhouette (helmet + body + spear) -->
    <g id="soldier">
      <circle cx="0" cy="-46" r="9"/>
      <path d="M-16 -34 L16 -34 L22 10 L-22 10 Z"/>
      <path d="M-10 10 L-12 42 L-3 42 L0 16 L3 42 L12 42 L10 10 Z"/>
      <rect x="26" y="-70" width="3" height="112"/>
      <path d="M27.5 -84 L33 -68 L22 -68 Z"/>
      <rect x="-6" y="-48" width="4" height="2.5" fill="#b57bff"/>
      <rect x="2" y="-48" width="4" height="2.5" fill="#b57bff"/>
    </g>
  </defs>

  <rect width="1000" height="340" fill="url(#bg)"/>

  <!-- pulsing aura -->
  <circle cx="500" cy="175" r="190" fill="url(#aura)">
    <animate attributeName="r" values="165;215;165" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;1;.7" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- rising shadow particles -->
  <g fill="#b57bff">
    <circle cx="80"  cy="340" r="2"><animate attributeName="cy" values="340;-10" dur="6s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s"  repeatCount="indefinite"/></circle>
    <circle cx="170" cy="340" r="3"><animate attributeName="cy" values="340;-10" dur="8s"  begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s"  begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="340" r="2"><animate attributeName="cy" values="340;-10" dur="7s"  begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s"  begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="340" r="2.5"><animate attributeName="cy" values="340;-10" dur="9s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="340" r="2"><animate attributeName="cy" values="340;-10" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="340" r="3"><animate attributeName="cy" values="340;-10" dur="8.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="340" r="2"><animate attributeName="cy" values="340;-10" dur="7s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="340" r="2.5"><animate attributeName="cy" values="340;-10" dur="9s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="340" r="2"><animate attributeName="cy" values="340;-10" dur="6s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="340" r="3"><animate attributeName="cy" values="340;-10" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- daggers (left + right) -->
  <g filter="url(#glow)">
    <g transform="translate(190 150) rotate(-30)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -8;0 0" dur="3s" repeatCount="indefinite"/>
      <polygon points="0,-95 11,-12 0,10 -11,-12" fill="url(#blade)"/>
      <rect x="-24" y="8" width="48" height="7" rx="2" fill="#3B0F8C"/>
      <rect x="-4" y="15" width="8" height="34" rx="2" fill="#2a1466"/>
    </g>
    <g transform="translate(810 150) rotate(30)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -8;0 0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <polygon points="0,-95 11,-12 0,10 -11,-12" fill="url(#blade)"/>
      <rect x="-24" y="8" width="48" height="7" rx="2" fill="#3B0F8C"/>
      <rect x="-4" y="15" width="8" height="34" rx="2" fill="#2a1466"/>
    </g>
  </g>

  <!-- title -->
  <text x="500" y="178" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="22" fill="#ffffff" filter="url(#glow)">ARISE
    <animate attributeName="fill-opacity" values="1;.78;1" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="218" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" letter-spacing="7" fill="#00C8FF">SHADOW MONARCH  •  VECTOR NOMAD HP88</text>

  <!-- fog + shadow army -->
  <rect y="230" width="1000" height="110" fill="url(#fog)"/>
  <g fill="#0a0518" stroke="#7B2FFF" stroke-opacity=".55" stroke-width="1">
    <use href="#soldier" transform="translate(70 292) scale(.9)"><animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/></use>
    <use href="#soldier" transform="translate(190 300) scale(1.05)"><animate attributeName="opacity" values="1;.6;1" dur="3.4s" repeatCount="indefinite"/></use>
    <use href="#soldier" transform="translate(320 296)"><animate attributeName="opacity" values=".7;1;.7" dur="2.8s" repeatCount="indefinite"/></use>
    <use href="#soldier" transform="translate(430 304) scale(1.15)"><animate attributeName="opacity" values="1;.65;1" dur="3.2s" repeatCount="indefinite"/></use>
    <use href="#soldier" transform="translate(570 304) scale(1.15)"><animate attributeName="opacity" values=".65;1;.65" dur="3.2s" repeatCount="indefinite"/></use>
    <use href="#soldier" transform="translate(680 296)"><animate attributeName="opacity" values="1;.7;1" dur="2.8s" repeatCount="indefinite"/></use>
    <use href="#soldier" transform="translate(810 300) scale(1.05)"><animate attributeName="opacity" values=".6;1;.6" dur="3.4s" repeatCount="indefinite"/></use>
    <use href="#soldier" transform="translate(930 292) scale(.9)"><animate attributeName="opacity" values="1;.6;1" dur="3s" repeatCount="indefinite"/></use>
  </g>
</svg>
