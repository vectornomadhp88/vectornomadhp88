<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Shadow extraction animation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04020c"/><stop offset="1" stop-color="#1a0b3d"/></linearGradient><filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="900" height="320" fill="url(#bg)"/>
<g transform="translate(450 258)">
 <ellipse rx="10" ry="3" fill="none" stroke="#A66BFF" stroke-width="3"><animate attributeName="rx" values="10;260;260" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/><animate attributeName="ry" values="3;40;40" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;0" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="10" ry="3" fill="none" stroke="#00C8FF" stroke-width="2"><animate attributeName="rx" values="10;200;200" keyTimes="0;.5;1" dur="6s" begin=".6s" repeatCount="indefinite"/><animate attributeName="ry" values="3;30;30" keyTimes="0;.5;1" dur="6s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;0" keyTimes="0;.5;1" dur="6s" begin=".6s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="95" ry="14" fill="#7B2FFF" opacity=".35"/>
</g>
<g fill="#0a0518" stroke="#A66BFF" stroke-width="2" filter="url(#g)">
 <g><animateTransform attributeName="transform" type="translate" values="450 330;450 250;450 250;450 330" keyTimes="0;.35;.85;1" dur="6s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.35;.85;1" dur="6s" repeatCount="indefinite"/>
 <circle cx="0" cy="-118" r="22"/><path d="M-46 -92 L46 -92 L58 -10 L-58 -10 Z"/><path d="M-28 -10 L-34 62 L-8 62 L0 0 L8 62 L34 62 L28 -10 Z"/><rect x="66" y="-170" width="5" height="230"/><path d="M68.5 -196 L82 -164 L55 -164 Z"/>
 <rect x="-13" y="-124" width="9" height="5" fill="#d9b8ff" stroke="none"/><rect x="4" y="-124" width="9" height="5" fill="#d9b8ff" stroke="none"/></g>
</g>
<text x="450" y="70" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="18" fill="#fff" filter="url(#g)" opacity="0">ARISE<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.45;.85;1" dur="6s" repeatCount="indefinite"/></text>
<text x="450" y="302" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" letter-spacing="5" fill="#00C8FF">[ SHADOW EXTRACTION IN PROGRESS ]</text>
