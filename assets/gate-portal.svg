<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Dungeon gate portal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><radialGradient id="c"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#7B2FFF"/><stop offset="1" stop-color="#05030f" stop-opacity="0"/></radialGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05030f"/><stop offset="1" stop-color="#140a33"/></linearGradient><filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="900" height="360" fill="url(#bg)"/>
<g transform="translate(450 170)" filter="url(#g)">
 <circle r="120" fill="url(#c)" opacity=".55"><animate attributeName="r" values="100;135;100" dur="4s" repeatCount="indefinite"/></circle>
 <ellipse rx="150" ry="150" fill="none" stroke="#7B2FFF" stroke-width="4" stroke-dasharray="40 18"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="120" ry="120" fill="none" stroke="#00C8FF" stroke-width="3" stroke-dasharray="10 14"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="9s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="88" ry="88" fill="none" stroke="#A66BFF" stroke-width="2.5" stroke-dasharray="70 20 6 20"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/></ellipse>
 <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="12s" repeatCount="indefinite"/></polygon>
</g>
<text x="450" y="178" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="10" fill="#fff" filter="url(#g)">A-RANK GATE</text>
<text x="450" y="340" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" letter-spacing="6" fill="#00C8FF">[ DUNGEON DETECTED  •  BHUNETRA ]<animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></text>
</svg>