<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="System notification window" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a3a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#070b1e" stop-opacity=".95"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="888" height="178" rx="10" fill="url(#p)" stroke="#00C8FF" stroke-width="2" filter="url(#g)">
    <animate attributeName="stroke-opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="6" y="6" width="888" height="34" rx="10" fill="#00C8FF" fill-opacity=".14"/>
  <text x="450" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" font-weight="bold" letter-spacing="8" fill="#00C8FF">[ NOTIFICATION ]</text>
  <g font-family="'Courier New', monospace" font-size="19" fill="#d8e9ff">
    <text x="40" y="82">You have acquired a new title.</text>
    <text x="40" y="116" fill="#A66BFF" font-weight="bold">《 Shadow Monarch of Data 》</text>
    <text x="40" y="150">Do you wish to level up?   <tspan fill="#00C8FF" font-weight="bold">[ YES ]</tspan>   [ NO ]<tspan fill="#00C8FF">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
